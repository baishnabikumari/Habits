<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-mark">⚪️</span>
            <span class="logo-text">Habits</span>
        </div>
        <div class="topbar-right">
            <span class="today-date" id="todayDate">Loading...</span>

                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                </svg> -->
            </button>
        </div>
    </header>

    <main class="wrap">
        <section class="stats-row" id="statsRow">
            <div class="stat-card">
                <span class="stat-label">Current streak</span>
                <span class="stat-value" id="statCurrentStreak">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Longest streak</span>
                <span class="stat-value" id="statLongestStreak">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Completion rate</span>
                <span class="stat-value" id="statCompletionRate">0%</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total Habits</span>
                <span class="stat-value" id="statTotalHabits">0</span>
            </div>
        </section>

        <section class="checklist-section">
            <div class="section-head">
                <h2>Today</h2>
            </div>

            <div class="add-habit-row" id="addHabitRow">
                <input type="text" id="newHabitInput" placeholder="Add a habit..." maxlength="40">
                <button id="addHabitBtn" class="add-btn" aria-label="Add habit">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>

            <ul class="habit-list" id="habitList">
                <!-- row by js -->
            </ul>
            <p class="empty-state" id="emptyState">No habit yet. Add your first one above in the box.</p>
        </section>

        <section class="heatmap-section">
            <div class="section-head">
                <h2>Activity</h2>
                <span class="heatmap-range" id="heatmapRange"></span>
            </div>
            <div class="heatmap-scroll">
                <div class="heatmap-grid" id="heatmapGrid"></div>
            </div>
            <div class="heatmap-legend">
                <span>Less</span>
                <span class="legend-cell level-0"></span>
                <span class="legend-cell level-1"></span>
                <span class="legend-cell level-2"></span>
                <span class="legend-cell level-3"></span>
                <span class="legend-cell level-4"></span>
                <span>More</span>
            </div>
        </section>
    </main>
    <div class="heatmap-tooltip" id="heatmapTooltip" hidden></div>
    <script src="app.js"></script>
</body>
</html>
