<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="topbar">
        <div class="logo">
            <span class="logo-mark">⚪️</span>
            <span class="logo-text">Habits</span>
        </div>
        <div class="topbar-right">
            <span class="today-date" id="todayDate">Loading...</span>
            <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="4"></circle>
                    <line x1="12" y1="1" x2="12" y2="2"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x="4" y1="4" x2="5.12" y2="5.12"></line>
                    <line x1="18" y1="18" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4" y1="19" x2="5" y2="18"></line>
                    <line x1="18" y1="5" x2="19" y2="4"></line>
                </svg>
            </button>
        </div>
    </header>

    <main class="wrap"></main>
    <script src="app.js"></script>
</body>
</html>
